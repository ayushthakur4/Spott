services:
  - type: web
    name: spott
    env: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 22.x
      # Database and Authentication (You must provide these in the Render dashboard)
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Cloudinary Config
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
